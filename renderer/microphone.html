<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PI Bot · 麦克风</title><style>
:root{color-scheme:light dark;font:14px/1.6 system-ui;color:light-dark(#141414,#f2f2f2);background:light-dark(#fcfcfc,#141414)}body{margin:0;padding:calc(var(--pi-plugin-titlebar-height,46px) + 18px) 24px 22px}h1{font-size:18px;margin:0 0 8px}p{font-size:12px;opacity:.65}label{display:block;margin:18px 0 6px}select option{background:light-dark(#fcfcfc,#202020);color:light-dark(#141414,#f2f2f2)}select{width:100%;padding:9px;border:1px solid #8884;border-radius:12px;background:transparent;color:inherit;font:inherit}button{font:inherit;border:0;border-radius:12px;padding:8px 14px;cursor:pointer;background:light-dark(#eee,#292929);color:inherit}button:disabled{opacity:.5}#actions{display:flex;gap:8px;margin-top:14px}#level{width:100%;height:6px;border-radius:6px;margin:20px 0;background:#8882;overflow:hidden}#meter{height:100%;width:0;background:#4d6bfe;transition:width .1s}#status{min-height:44px;font-size:13px}#stop{background:#ff3e51;color:white}a{color:#4d6bfe;font-size:12px}
</style></head><body><h1>麦克风</h1><p>录音期间请保持此面板打开。只采集音频；结束语音后会释放设备。</p><label for="devices">输入设备</label><select id="devices"><option value="">系统默认麦克风</option></select><div id="actions"><button id="detect">检测 / 刷新设备</button><button id="test">测试麦克风</button><button id="stop" hidden>停止</button></div><div id="level"><div id="meter"></div></div><div id="status" role="status">点击检测设备并选择麦克风；也可直接在 Bot 中开始语音。</div><p>若权限被系统阻止：Windows 设置 → 隐私和安全性 → 麦克风 → 允许桌面应用访问。</p><script type="module" src="microphone-panel.mjs"></script></body></html>
