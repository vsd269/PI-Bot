name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run package
      - run: npm run verify:package
      - run: npm run preflight:market
      - uses: actions/upload-artifact@v4
        with:
          name: pi-bot-package
          path: |
            dist/*.piplug
            dist/SHA256SUMS.txt
          retention-days: 14
